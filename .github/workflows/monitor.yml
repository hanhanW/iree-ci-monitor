name: monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py

      - name: Report
        run: python scripts/report.py

      - name: Benchmark results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IREE_BENCHMARK_LOOKBACK_DAYS: "3"
        run: python scripts/benchmark_collect.py

      - name: Benchmark suite manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/benchmark_suite_manifest.py

      - name: Dashboard
        run: python scripts/dashboard.py

      - name: Commit & push
        run: |
          git config user.name "iree-ci-monitor[bot]"
          git config user.email "iree-ci-monitor[bot]@users.noreply.github.com"
          git add -A data README.md status.md daily.md docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "monitor: refresh $(TZ=America/Los_Angeles date '+%Y-%m-%dT%H:%M %Z')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
